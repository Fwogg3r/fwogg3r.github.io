<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thomas Bryant · Fwogg3r</title>
    <link rel="stylesheet" href="members.css">
    <script src="site.js" defer></script>
    <script type="module">
      import { mountUserMenu } from "./auth.js";
      mountUserMenu();
    </script>
  </head>
  <body>
    <main class="landing">
      <p class="prompt">C:\FWOGG3R&gt; whoami</p>
      <h1 class="hero">Hi, I'm <span class="name" id="name" tabindex="0" aria-label="Thomas Bryant, also known as Fwogg3r">Thomas Bryant</span>!<span class="cursor" aria-hidden="true"></span></h1>
      <p class="sub">Use the [ MENU ] in the top left to look around.</p>
    </main>

    <script>
      // Hovering the name "backspaces" it away and types the alias; leaving reverses it.
      (function () {
        var el = document.getElementById("name");
        var REAL = "Thomas Bryant";
        var ALIAS = "Fwogg3r";
        var target = REAL;
        var timer = null;
        var DELETE_MS = 55;
        var TYPE_MS = 95;

        function step() {
          var cur = el.textContent;
          var delay;
          if (cur === target) { timer = null; return; }
          if (target.indexOf(cur) !== 0) {
            // Current text isn't the start of the target: backspace one character.
            el.textContent = cur.slice(0, -1);
            delay = DELETE_MS;
          } else {
            // Type the next character of the target.
            el.textContent = target.slice(0, cur.length + 1);
            delay = TYPE_MS + Math.random() * 60;
          }
          timer = setTimeout(step, delay);
        }

        function go(next) {
          target = next;
          if (!timer) step();
        }

        // The name shrinks while it's being deleted, so the pointer can end up outside it
        // without actually moving away. Remember the area it covered when hovered and
        // only switch back once the pointer leaves that whole area.
        var zone = null;
        function inside(r, x, y) {
          return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
        }
        el.addEventListener("mouseenter", function () {
          zone = el.getBoundingClientRect();
          go(ALIAS);
        });
        document.addEventListener("mousemove", function (e) {
          if (!zone) return;
          var now = el.getBoundingClientRect();
          if (!inside(zone, e.clientX, e.clientY) && !inside(now, e.clientX, e.clientY)) {
            zone = null;
            go(REAL);
          }
        });
        document.addEventListener("mouseleave", function () {
          if (zone) { zone = null; go(REAL); }
        });
        window.addEventListener("scroll", function () {
          if (zone) zone = el.getBoundingClientRect();
        }, { passive: true });
        el.addEventListener("focus", function () { go(ALIAS); });
        el.addEventListener("blur", function () { go(REAL); });
        // Touch screens have no hover: tap to toggle.
        el.addEventListener("touchstart", function (e) {
          e.preventDefault();
          go(target === ALIAS ? REAL : ALIAS);
        }, { passive: false });
      })();
    </script>
  </body>
</html>
